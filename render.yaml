services:
  - type: web
    name: alumni-connect
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_KEY
        generateValue: true
      - key: SETUP_KEY
        generateValue: true
